name: Deploy to Vercel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm install

    - name: Build application
      run: npm run build
      env:
        NODE_OPTIONS: --max-old-space-size=4096

    - name: Skip Vercel deployment (secrets not configured)
      if: secrets.VERCEL_TOKEN == ''
      run: echo "⚠️ Vercel deployment skipped - VERCEL_TOKEN secret not configured"
        
    - name: Install Vercel CLI
      if: secrets.VERCEL_TOKEN != ''
      run: npm install --global vercel@latest
      
    - name: Pull Vercel Environment Information
      if: secrets.VERCEL_TOKEN != ''
      run: vercel pull --yes --environment=preview --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Build Project Artifacts
      if: secrets.VERCEL_TOKEN != ''
      run: vercel build --token=${{ secrets.VERCEL_TOKEN }}
      
    - name: Deploy to Vercel (Production)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && secrets.VERCEL_TOKEN != ''
      run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
        
    - name: Deploy to Vercel (Preview)
      if: (github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master') && secrets.VERCEL_TOKEN != ''
      run: vercel deploy --prebuilt --token=${{ secrets.VERCEL_TOKEN }}
        
    - name: Comment PR with deployment status
      if: github.event_name == 'pull_request' && secrets.VERCEL_TOKEN != ''
      uses: actions/github-script@v7
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: `🚀 **Deployment Complete!**
            \n\n✅ Your changes have been successfully deployed to Vercel.
            \n\nThe preview deployment will be available shortly and will be automatically updated when you push new commits to this PR.`
          });
